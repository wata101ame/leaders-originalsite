<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/plants.css" />
    <title>植物の詩</title>
  </head>
  <body>
    <section class="tulip-poem">
      <canvas id="tulipcanvas"></canvas>

      <div class="tulip-text">
        <p class="tulip-1">
          蜂の羽音が<br />
          チューリップの花に消える<br />
          微風の中にひつそりと<br />
          客を迎へた赤い部屋<br />
        </p>
      </div>
      <div class="poem-title">
        <h4>チューリップ　　　三好達治</h4>
      </div>
      <script src="/js/tulip.js"></script>
    </section>
    <section class="tree-poem">
      <canvas id="leavescanvas"></canvas>

      <div class="tree-text">
        <p class="tree-1">
          小鳥は<br />
          小枝のてっぺんに、<br />
          子供は<br />
          木かげの鞦韆に、<br />
          小ちゃな葉っぱは<br />
          芽のなかに。
        </p>
        <p class="tree-2">
          あの木は、<br />
          あの木は、<br />
          うれしかろ。
        </p>
      </div>
      <div class="poem-title">
        <h4>木　　　　　　　金子みすゞ</h4>
      </div>
      <script src="/js/tree.js"></script>
    </section>
    <section class="suisen-poem">
      <canvas id="canvas"></canvas>

      <div class="suisen-text">
        <p class="suisen-1">
          水仙が駿河の山に重れる甲斐路の <br />雪の山めきて喚く
        </p>
        <p class="suisen-2">
          わたつみの底つ玉藻も<br />水仙の白きも点ず長濱の路
        </p>
        <p class="suisen-3">
          水仙は南信濃の山上の雪の味にも<br />かよふ香を吐く
        </p>
        <p class="suisen-4">
          船かへる藻屑と混る水仙に<br />云ふことのあるここちすれども
        </p>
        <p class="suisen-5">
          水仙は萎れし後も明星に<br />似たる蓋をばただなかに置く
        </p>
      </div>

      <div class="poem-title">
        <h4>水仙　　　　　　与謝野晶子</h4>
      </div>

      <script src="/js/suisen.js"></script>
    </section>
  </body>
</html>
