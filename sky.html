<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <section class="umi-poem">
      <div class="poem-text">
        <p>
          少年が沖にむかって呼んだ<br />「おーい」<br />
          まわりの子どもたちも<br />
          つぎつぎに呼んだ <br />「おーい」「おーい」
          <br />そして　おとなも<br />
          「おーい」と呼んだ<br />
        </p>
        <p>
          子どもたちは　それだけで <br />とてもたのしそうだった <br />
          けれど　おとなは<br />
          いつまでもじっと待っていた<br />
          海が　何かをこたえてくれるかのように
        </p>
      </div>
    </section>
  </body>
</html>
